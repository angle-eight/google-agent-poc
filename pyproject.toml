[project]
name = "google-agent-poc"
version = "0.1.0"
description = "Japanese helpdesk agent built with Google ADK and Agent Platform Runtime"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.11.0,<3",
    "google-cloud-aiplatform[agent_engines,adk]>=1.165.1,<2",
    "google-genai>=2.28.0,<3",
    "pydantic>=2.13.5,<3",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.34.0,<1",
    "python-dotenv>=1.1.0,<2",
    "itsdangerous>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=1.0.0,<2",
    "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
